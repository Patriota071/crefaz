<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crefaz | Validação de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #0054A6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div id="app" class="min-h-screen flex flex-col items-center">
        <header class="w-full bg-white py-6 flex justify-center shadow-sm border-b border-slate-100">
            <img src="https://play-lh.googleusercontent.com/v_NINxO2vFyYoLXjP_0ZO8ceXUbEJgHHLPLXTI3prjM_cCXbdG1ftfPd5aDcgm8UX74P=w240-h480-rw" alt="Crefaz" class="h-12">
        </header>

        <main class="flex-1 flex flex-col items-center justify-center px-6 w-full max-w-md text-center">
            <div id="step1" class="block">
                <div class="bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mb-6 mx-auto">
                    <svg class="w-10 h-10 text-[#0054A6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 mb-4">Validar Proposta</h1>
                <p class="text-slate-500 mb-8">Clique abaixo para confirmar seus dados e finalizar o atendimento no WhatsApp.</p>
                <button onclick="iniciar()" class="w-full bg-[#0054A6] text-white py-4 rounded-2xl font-bold shadow-lg">Validar Dados</button>
            </div>

            <div id="step2" class="hidden w-full">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-16 w-16 mb-4 mx-auto"></div>
                <h2 class="text-xl font-bold text-slate-700">Validando informações...</h2>
            </div>

            <div id="step3" class="hidden w-full bg-white p-8 rounded-3xl shadow-xl border border-green-50">
                <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-6">Sucesso!</h2>
                <div class="text-left space-y-4">
                    <div class="flex gap-3 text-sm p-3 bg-slate-50 rounded-lg">
                        <b class="text-[#0054A6]">1.</b> <p>Feche esta página.</p>
                    </div>
                    <div class="flex gap-3 text-sm p-3 bg-slate-50 rounded-lg">
                        <b class="text-[#0054A6]">2.</b> <p>Volte ao <b>WhatsApp</b> para concluir.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function iniciar() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
